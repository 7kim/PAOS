<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded app-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- orchestration graph: a hub node connected to four agent nodes -->
  <g filter="url(#soft)">
    <!-- edges -->
    <line x1="256" y1="256" x2="160" y2="160" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="352" y2="160" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="160" y2="352" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="352" y2="352" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round"/>

    <!-- outer agent nodes -->
    <circle cx="160" cy="160" r="30" fill="url(#node)"/>
    <circle cx="352" cy="160" r="30" fill="url(#node)"/>
    <circle cx="160" cy="352" r="30" fill="url(#node)"/>
    <circle cx="352" cy="352" r="30" fill="url(#node)"/>

    <!-- central orchestrator node -->
    <circle cx="256" cy="256" r="46" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="46" fill="none" stroke="#A5F3FC" stroke-width="5"/>
  </g>
</svg>
