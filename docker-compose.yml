version: '3.8'

services:
  dashboard:
    build: .
    ports:
      - "3333:3333"
    volumes:
      - ~/AI_Workflow:/home/dev/AI_Workflow
      - ~/.hermes:/home/dev/.hermes
      - paos_data:/data
    environment:
      - MEMORY_DIR=/data/memory
      - WORKSPACES_DIR=/data/workspaces
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  paos_data:
